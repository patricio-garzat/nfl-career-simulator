<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem('nfl_theme')||'dark'}catch(e){}</script>
  <script>
    // auto-update: GitHub Pages lets browsers keep files for ~10 minutes, so on every visit we ask version.json (never cached) and, if a newer build is published, reload once on a fresh URL
    window.APP_BUILD = '20261002-56';
    try { fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.v && j.v !== window.APP_BUILD) { var k = 'nfl_reloaded_' + j.v; if (!sessionStorage.getItem(k)) { sessionStorage.setItem(k, '1'); location.replace(location.pathname + '?v=' + j.v); } }
    }).catch(function () {}); } catch (e) {}
  </script>
  <title>NFL Career Simulator</title>
  <!-- Sports-style fonts (falls back gracefully when offline) -->
  <link rel="preconnect" href="https://sleepercdn.com">
  <link rel="preconnect" href="https://a.espncdn.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Inter:wght@400;500;600;700&display=swap&family=Anton&family=Oswald:wght@600;700&family=Graduate&family=Alfa+Slab+One&family=Teko:wght@600;700&family=Saira+Extra+Condensed:wght@800;900&family=Archivo+Black&family=Russo+One&family=Racing+Sans+One&family=Black+Ops+One&family=Squada+One&family=Rye&family=Cinzel:wght@900&family=Pacifico&family=Stardos+Stencil:wght@700" rel="stylesheet">
